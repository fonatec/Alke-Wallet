<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Alke Wallet</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- CSS propio -->
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-light">

  <main class="container min-vh-100 d-flex justify-content-center align-items-center">
    <section class="card shadow-lg border-0 login-card">
      <div class="card-body p-4 p-md-5">

        <div class="text-center mb-4">
          <h1 class="fw-bold text-primary">Alke Wallet</h1>
          <p class="text-muted">Ingresa a tu billetera digital</p>
        </div>

        <form id="formLogin">
          <div class="mb-3">
            <label for="email" class="form-label">Correo electrónico</label>
            <input 
              type="email" 
              class="form-control" 
              id="email" 
              placeholder="admin@email.com"
              required>
          </div>

          <div class="mb-3">
            <label for="password" class="form-label">Contraseña</label>
            <input 
              type="password" 
              class="form-control" 
              id="password" 
              placeholder="Ingresa tu contraseña"
              required>
          </div>

          <div id="mensajeLogin" class="alert d-none" role="alert"></div>

          <button type="submit" class="btn btn-primary w-100">
            Iniciar sesión
          </button>
        </form>

        <div class="text-center mt-4">
          <small class="text-muted">
            Usuario de prueba: admin@email.com / 1234
          </small>
        </div>

      </div>
    </section>
  </main>

  <!-- jQuery -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- JS propio -->
  <script src="assets/js/script.js"></script>
</body>
</html>
