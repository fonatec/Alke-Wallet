<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Depositar | Alke Wallet</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- CSS propio -->
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-light">

  <!-- Barra de navegación -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand fw-bold" href="menu.html">Alke Wallet</a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarWallet">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarWallet">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link" href="menu.html">Inicio</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" href="deposit.html">Depositar</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="sendmoney.html">Enviar dinero</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="transactions.html">Movimientos</a>
          </li>
          <li class="nav-item">
            <button id="btnCerrarSesion" class="btn btn-light btn-sm ms-lg-3 mt-2 mt-lg-0">
              Cerrar sesión
            </button>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Contenido principal -->
  <main class="container py-5">

    <section class="mb-4">
      <h1 class="fw-bold">Depositar dinero</h1>
      <p class="text-muted">Agrega fondos a tu cuenta Alke Wallet.</p>
    </section>

    <section class="row g-4">
      
      <!-- Tarjeta saldo -->
      <div class="col-12 col-lg-5">
        <div class="card shadow-sm border-0 card-wallet">
          <div class="card-body p-4">
            <p class="text-muted mb-1">Saldo disponible</p>
            <h2 class="fw-bold text-primary" id="saldoDeposito">$0</h2>
            <p class="small text-muted mb-0">
              El saldo se actualizará automáticamente después de realizar un depósito.
            </p>
          </div>
        </div>
      </div>

      <!-- Formulario depósito -->
      <div class="col-12 col-lg-7">
        <div class="card shadow-sm border-0">
          <div class="card-body p-4">
            <h3 class="fw-bold mb-3">Nuevo depósito</h3>

            <form id="formDeposito">
              <div class="mb-3">
                <label for="montoDeposito" class="form-label">Monto a depositar</label>
                <input 
                  type="number" 
                  class="form-control" 
                  id="montoDeposito" 
                  placeholder="Ejemplo: 50000"
                  min="1"
                  required>
              </div>

              <div id="mensajeDeposito" class="alert d-none" role="alert"></div>

              <button type="submit" class="btn btn-success w-100">
                Realizar depósito
              </button>
            </form>

            <div class="mt-3">
              <a href="menu.html" class="btn btn-outline-secondary w-100">
                Volver al menú principal
              </a>
            </div>

          </div>
        </div>
      </div>

    </section>

  </main>

  <!-- jQuery -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- JS propio -->
  <script src="assets/js/script.js"></script>
</body>
</html>
